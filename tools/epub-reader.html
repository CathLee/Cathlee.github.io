<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EPUB Reader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --bg:#f7f3ec; --panel:#efe9df; --ink:#2a2622; --muted:#7a7066; --line:#ddd4c6;
    --accent:#a2532f; --fs:19px;
  }
  body.dark{ --bg:#1b1a19; --panel:#232120; --ink:#e7e1d8; --muted:#9a9187; --line:#34312e; --accent:#e08a5c; }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;transition:background .2s,color .2s}
  button{font:inherit;color:inherit;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  button:disabled{opacity:.35;cursor:default;color:inherit;border-color:var(--line)}

  /* Landing */
  #drop{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px}
  .card{max-width:520px;width:100%;text-align:center;border:2px dashed var(--line);border-radius:18px;padding:48px 28px;background:var(--panel)}
  .card.over{border-color:var(--accent)}
  .card h1{font-family:Literata,serif;font-weight:600;font-size:30px;margin:0 0 10px}
  .card p{color:var(--muted);line-height:1.55;margin:0 0 22px}
  .pick{display:inline-block;background:var(--accent);color:#fff;border:none;border-radius:10px;padding:12px 22px;font-weight:600;cursor:pointer}
  .pick:hover{color:#fff;filter:brightness(1.08)}
  #err{color:#c0392b;margin-top:16px;min-height:1em}
  .note{font-size:13px;margin-top:18px !important}

  /* Reader */
  #reader{display:none;height:100%}
  header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
  header .title{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header .title small{display:block;font-weight:400;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis}
  #toc{position:fixed;top:0;left:0;bottom:0;width:min(340px,86vw);background:var(--panel);border-right:1px solid var(--line);transform:translateX(-100%);transition:transform .25s;z-index:20;overflow:auto;padding:18px 0}
  #toc.open{transform:none}
  #toc h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 20px 10px}
  #toc a{display:block;padding:8px 20px;color:var(--ink);text-decoration:none;line-height:1.35;font-size:14px;border-left:3px solid transparent}
  #toc a:hover{background:var(--bg)}
  #toc a.cur{border-left-color:var(--accent);color:var(--accent);font-weight:500}
  #toc a.lvl2{padding-left:36px;font-size:13px;color:var(--muted)}
  #scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:15;display:none}
  #scrim.on{display:block}

  main{max-width:720px;margin:0 auto;padding:36px 24px 40px}
  #page{font-family:Literata,Georgia,serif;font-size:var(--fs);line-height:1.7;overflow-wrap:break-word}
  #page img,#page svg{max-width:100%;height:auto;display:block;margin:1.2em auto;border-radius:4px}
  #page h1,#page h2,#page h3{line-height:1.25;font-weight:600}
  #page h1{font-size:1.6em}#page h2{font-size:1.35em}#page h3{font-size:1.15em}
  #page a{color:var(--accent)}
  #page blockquote{margin:1.2em 0;padding-left:1em;border-left:3px solid var(--line);color:var(--muted)}
  #page table{border-collapse:collapse;max-width:100%}
  #page td,#page th{border:1px solid var(--line);padding:4px 8px}
  .center{text-align:center}

  footer{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:720px;margin:0 auto;padding:12px 24px 40px;color:var(--muted);font-size:13px}
  .bar{height:3px;background:var(--line);position:sticky;top:0}
  .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}

  /* Read aloud */
  #tts{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:10;display:none;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;
    width:max-content;max-width:calc(100vw - 20px);padding:8px 12px;background:var(--panel);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.18);font-size:13px}
  body.tts-on #tts{display:flex}
  body.tts-on footer{padding-bottom:130px}
  body.tts-on #speak{border-color:var(--accent);color:var(--accent)}
  #tts button{min-width:38px}
  #tts select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 6px;max-width:210px}
  #tts label{display:flex;align-items:center;gap:5px;color:var(--muted);white-space:nowrap;cursor:pointer}
  #ttsMsg{flex-basis:100%;text-align:center;color:#c0392b;display:none}
  .tts-cur{background:color-mix(in srgb,var(--accent) 16%,transparent);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 16%,transparent);border-radius:3px;transition:background .2s}
  body.tts-on #page .tts-block{cursor:pointer}
</style>
</head>
<body>

<section id="drop">
  <div class="card" id="card">
    <h1>EPUB Reader</h1>
    <p>Open an EPUB from your device and read it here page by page, with a table of contents, adjustable text size, a dark mode and read‑aloud.</p>
    <label class="pick">Choose an EPUB file<input id="file" type="file" accept=".epub,application/epub+zip" hidden></label>
    <p class="note">…or drop the file onto this box. The book is read only in your browser. Nothing is uploaded or saved anywhere.</p>
    <div id="err"></div>
  </div>
</section>

<section id="reader">
  <header>
    <button id="tocBtn" title="Contents">☰</button>
    <div class="title"><span id="bookTitle"></span><small id="chapTitle"></small></div>
    <button id="speak" title="Read this page aloud">🔊</button>
    <button id="smaller" title="Smaller text">A−</button>
    <button id="bigger" title="Larger text">A+</button>
    <button id="theme" title="Dark / light">◐</button>
    <button id="close" title="Open another book">✕</button>
  </header>
  <div class="bar"><i id="prog"></i></div>
  <nav id="toc"><h2>Contents</h2><div id="tocList"></div></nav>
  <div id="scrim"></div>
  <main><article id="page"></article></main>
  <div id="tts" role="group" aria-label="Read aloud">
    <button id="ttsPlay" title="Play / pause">▶</button>
    <button id="ttsStop" title="Stop and close">■</button>
    <select id="ttsRate" title="Speed">
      <option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option>
      <option value="1.5">1.5×</option><option value="1.75">1.75×</option><option value="2">2×</option>
    </select>
    <select id="ttsVoice" title="Voice for this page's language"><option value="">Auto voice</option></select>
    <label title="Keep reading into the next page when this one ends"><input id="ttsAuto" type="checkbox" checked> Continue to next page</label>
    <div id="ttsMsg"></div>
  </div>
  <footer>
    <button id="prev">← Previous</button>
    <span id="count"></span>
    <button id="next">Next →</button>
  </footer>
</section>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const store = {
    get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
    set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
  };

  let zip, spine = [], cur = 0, blobCache = {}, bookKey = '', tocItems = [], bookLang = '';

  // ---------- path helpers ----------
  const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
  function resolve(base, rel){
    rel = decodeURIComponent(rel.split('#')[0].split('?')[0]);
    if (!rel) return base;
    const parts = (rel.startsWith('/') ? rel.slice(1) : dirOf(base) + rel).split('/');
    const out = [];
    for (const s of parts){ if (s === '..') out.pop(); else if (s !== '.' && s !== '') out.push(s); }
    return out.join('/');
  }
  const findFile = p => zip.file(p) || zip.file(Object.keys(zip.files).find(k => k.toLowerCase() === p.toLowerCase()) || '\0');

  async function text(p){ const f = findFile(p); return f ? f.async('string') : null; }
  async function blobUrl(p){
    if (blobCache[p]) return blobCache[p];
    const f = findFile(p); if (!f) return '';
    const ext = p.split('.').pop().toLowerCase();
    const type = {jpg:'image/jpeg',jpeg:'image/jpeg',png:'image/png',gif:'image/gif',svg:'image/svg+xml',webp:'image/webp'}[ext] || 'application/octet-stream';
    return blobCache[p] = URL.createObjectURL(new Blob([await f.async('uint8array')], {type}));
  }
  function parseXml(s, html){
    let d = new DOMParser().parseFromString(s, html ? 'text/html' : 'application/xhtml+xml');
    if (!html && d.getElementsByTagName('parsererror').length) d = new DOMParser().parseFromString(s, 'text/html');
    return d;
  }
  const byTag = (el, name) => Array.from(el.getElementsByTagNameNS('*', name));

  // ---------- open book ----------
  async function openFile(file){
    $('err').textContent = '';
    try{
      zip = await JSZip.loadAsync(file);
      const container = parseXml(await text('META-INF/container.xml'));
      const opfPath = byTag(container, 'rootfile')[0].getAttribute('full-path');
      const opf = parseXml(await text(opfPath));

      const manifest = {};
      byTag(opf, 'item').forEach(it => manifest[it.getAttribute('id')] = {
        href: resolve(opfPath, it.getAttribute('href')),
        type: it.getAttribute('media-type') || '',
        props: it.getAttribute('properties') || ''
      });
      spine = byTag(opf, 'itemref')
        .filter(r => r.getAttribute('linear') !== 'no')
        .map(r => manifest[r.getAttribute('idref')]).filter(Boolean)
        .map(m => ({ href: m.href, title: '' }));

      const title = (byTag(opf, 'title')[0] || {}).textContent || file.name.replace(/\.epub$/i,'');
      const author = (byTag(opf, 'creator')[0] || {}).textContent || '';
      $('bookTitle').textContent = title.trim();
      document.title = title.trim() + ' · EPUB Reader';
      bookKey = 'epubpos:' + title.trim();
      bookLang = ((byTag(opf, 'language')[0] || {}).textContent || '').trim();

      await buildToc(opf, manifest, opfPath);
      if (author) $('bookTitle').textContent += ' — ' + author.trim();

      $('drop').style.display = 'none';
      $('reader').style.display = 'block';
      const saved = parseInt(store.get(bookKey), 10);
      show(isNaN(saved) ? 0 : Math.min(saved, spine.length - 1));
    }catch(e){
      console.error(e);
      $('err').textContent = "Couldn't open that file. Please make sure it's an unprotected (DRM-free) EPUB.";
    }
  }

  async function buildToc(opf, manifest, opfPath){
    tocItems = [];
    const navItem = Object.values(manifest).find(m => /\bnav\b/.test(m.props));
    if (navItem){
      const d = parseXml(await text(navItem.href));
      const nav = byTag(d, 'nav').find(n => (n.getAttribute('epub:type') || n.getAttributeNS('http://www.idpf.org/2007/ops','type') || '') .includes('toc')) || byTag(d,'nav')[0];
      if (nav) byTag(nav, 'a').forEach(a => {
        const depth = (() => { let n = 0, p = a.parentNode; while (p && p !== nav){ if (p.localName === 'ol' || p.localName === 'ul') n++; p = p.parentNode; } return n; })();
        tocItems.push({ label: a.textContent.trim().replace(/\s+/g,' '), href: resolve(navItem.href, a.getAttribute('href') || ''), depth });
      });
    }
    if (!tocItems.length){
      const ncx = Object.values(manifest).find(m => m.type === 'application/x-dtbncx+xml');
      if (ncx){
        const d = parseXml(await text(ncx.href));
        byTag(d, 'navPoint').forEach(np => {
          let depth = 0, p = np.parentNode; while (p && p.localName === 'navPoint'){ depth++; p = p.parentNode; }
          tocItems.push({ label: (byTag(np,'text')[0]||{}).textContent?.trim() || '', href: resolve(ncx.href, byTag(np,'content')[0].getAttribute('src')), depth: depth + 1 });
        });
      }
    }
    tocItems = tocItems.filter(t => t.label);
    tocItems.forEach(t => { const s = spine.find(x => x.href === t.href); if (s && !s.title) s.title = t.label; });
    if (!tocItems.length) tocItems = spine.map((s, i) => ({ label: 'Section ' + (i + 1), href: s.href, depth: 1 }));

    const list = $('tocList'); list.innerHTML = '';
    tocItems.forEach(t => {
      const a = document.createElement('a');
      a.href = '#'; a.textContent = t.label;
      if (t.depth > 1) a.className = 'lvl2';
      a.dataset.href = t.href;
      a.onclick = e => { e.preventDefault(); goHref(t.href); toggleToc(false); };
      list.appendChild(a);
    });
  }

  function goHref(href, anchor){
    const i = spine.findIndex(s => s.href === href);
    if (i >= 0) show(i, anchor);
  }

  // ---------- render a section ----------
  async function show(i, anchor, keepSpeech){
    if (!keepSpeech) tts.halt();
    cur = i; store.set(bookKey, String(i));
    const sec = spine[i];
    const raw = await text(sec.href) || '';
    const doc = parseXml(raw);
    const body = doc.body || byTag(doc, 'body')[0] || doc.documentElement;

    const page = $('page'); page.innerHTML = '';
    const frag = document.createElement('div');
    Array.from(body.childNodes).forEach(n => frag.appendChild(document.importNode(n, true)));

    // sanitize
    frag.querySelectorAll('script,style,link,iframe,object,embed,form,meta').forEach(n => n.remove());
    frag.querySelectorAll('*').forEach(el => {
      for (const a of Array.from(el.attributes)) {
        if (/^on/i.test(a.name) || a.name === 'style') el.removeAttribute(a.name);
      }
    });
    // images
    for (const img of frag.querySelectorAll('img')){
      const src = img.getAttribute('src'); if (src) img.src = await blobUrl(resolve(sec.href, src));
      img.loading = 'lazy';
    }
    for (const im of frag.querySelectorAll('image')){
      const h = im.getAttribute('href') || im.getAttributeNS('http://www.w3.org/1999/xlink','href');
      if (h){ const u = await blobUrl(resolve(sec.href, h)); im.setAttribute('href', u); im.setAttributeNS('http://www.w3.org/1999/xlink','xlink:href', u); }
    }
    // links
    frag.querySelectorAll('a[href]').forEach(a => {
      const h = a.getAttribute('href');
      if (/^(https?:|mailto:)/i.test(h)){ a.target = '_blank'; a.rel = 'noopener'; return; }
      const target = resolve(sec.href, h);
      const frag_id = h.includes('#') ? h.split('#')[1] : '';
      a.addEventListener('click', e => {
        e.preventDefault();
        if (target === sec.href && frag_id) scrollToId(frag_id); else goHref(target, frag_id);
      });
    });
    while (frag.firstChild) page.appendChild(frag.firstChild);

    // header + toc state
    const tocHit = [...tocItems].reverse().find(t => spine.findIndex(s => s.href === t.href) <= i && spine.findIndex(s => s.href === t.href) >= 0);
    $('chapTitle').textContent = sec.title || (tocHit ? tocHit.label : '');
    document.querySelectorAll('#tocList a').forEach(a => a.classList.toggle('cur', tocHit && a.dataset.href === tocHit.href));
    $('count').textContent = (i + 1) + ' / ' + spine.length;
    $('prog').style.width = ((i + 1) / spine.length * 100) + '%';
    $('prev').disabled = i === 0;
    $('next').disabled = i === spine.length - 1;

    if (anchor) setTimeout(() => scrollToId(anchor), 30); else window.scrollTo(0, 0);
  }
  function scrollToId(id){
    const el = $('page').querySelector('[id="' + CSS.escape(id) + '"],[name="' + CSS.escape(id) + '"]');
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  // ---------- controls ----------
  function toggleToc(force){
    const open = typeof force === 'boolean' ? force : !$('toc').classList.contains('open');
    $('toc').classList.toggle('open', open); $('scrim').classList.toggle('on', open);
    if (open){ const c = document.querySelector('#tocList a.cur'); if (c) c.scrollIntoView({block:'center'}); }
  }
  $('tocBtn').onclick = () => toggleToc();
  $('scrim').onclick = () => toggleToc(false);
  $('prev').onclick = () => cur > 0 && show(cur - 1);
  $('next').onclick = () => cur < spine.length - 1 && show(cur + 1);

  let fs = parseInt(store.get('epub:fs'), 10) || 19;
  const applyFs = () => { document.documentElement.style.setProperty('--fs', fs + 'px'); store.set('epub:fs', fs); };
  applyFs();
  $('smaller').onclick = () => { fs = Math.max(14, fs - 1); applyFs(); };
  $('bigger').onclick = () => { fs = Math.min(30, fs + 1); applyFs(); };

  if (store.get('epub:dark') === '1') document.body.classList.add('dark');
  $('theme').onclick = () => { const d = document.body.classList.toggle('dark'); store.set('epub:dark', d ? '1' : '0'); };

  $('close').onclick = () => {
    tts.close();
    Object.values(blobCache).forEach(URL.revokeObjectURL); blobCache = {};
    $('reader').style.display = 'none'; $('drop').style.display = 'flex'; $('file').value = '';
    document.title = 'EPUB Reader';
  };

  document.addEventListener('keydown', e => {
    if ($('reader').style.display !== 'block') return;
    if (e.key === 'ArrowRight') $('next').click();
    if (e.key === 'ArrowLeft') $('prev').click();
    if (e.key === 'Escape') toggleToc(false);
  });

  // ---------- read aloud (browser speech synthesis) ----------
  const tts = (() => {
    const synth = window.speechSynthesis;
    const noop = { halt(){}, close(){} };
    if (!synth || !window.SpeechSynthesisUtterance){ $('speak').style.display = 'none'; return noop; }

    let queue = [], pos = 0, playing = false, session = 0, utter = null, timer = 0;
    let voices = [], multi = new Set(), modernApple = false, pageLang = '';
    const bad = new Set();                                         // voices that failed to speak during this visit
    const SKIP = 'rt,rp,script,style,noscript,svg,math';
    const count = (t, re) => (t.match(re) || []).length;
    const isCJK = t => /[぀-ヿ㐀-鿿가-힯]/.test(t);

    // ---- text: page → blocks (paragraphs, headings, list items…) → sentence-sized chunks
    function blocks(){
      const page = $('page'), out = [];
      page.querySelectorAll('.tts-block').forEach(e => e.classList.remove('tts-block'));
      const w = document.createTreeWalker(page, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
      let last = null;
      for (let n; (n = w.nextNode()); ){
        if (n.nodeType === 1){ if (n.localName === 'br' && last) last.text += '\n'; continue; }   // a line break is a pause, not glue
        if (!n.nodeValue.trim()){ if (last) last.text += ' '; continue; }                          // keep the space between inline tags
        const pe = n.parentElement;
        if (pe.closest(SKIP) || !pe.getClientRects().length) continue;                             // hidden text is not read
        const sup = pe.closest('sup'), a = pe.closest('a');                                        // footnote markers are not read
        if (sup && /^[\s\[(（【]*(\d{1,3}|[*†‡§])[\s\])）】]*$/.test(sup.textContent)) continue;
        if (a && (/noteref/.test(a.getAttribute('epub:type') || '') || /^\s*[\[(（【]\s*\d{1,3}\s*[\])）】]\s*$/.test(a.textContent))) continue;
        let el = pe;
        while (el !== page && /^(inline|contents|ruby)/.test(getComputedStyle(el).display)) el = el.parentElement;
        if (!last || last.el !== el){ last = { el, text: '' }; out.push(last); if (el !== page) el.classList.add('tts-block'); }
        last.text += n.nodeValue;
      }
      return out;
    }
    function sentences(s){
      const out = []; let start = 0;
      const re = /[。！？!?；;…]+["'”’」』）)\]]*\s*|\.+["'”’)\]]*(?:\s+|$)/g;        // "3.14" and "a.com" are not sentence ends
      for (let m; (m = re.exec(s)); ){
        if (m[0][0] === '.' && /(?:^|[\s(“"])(?:[A-Z]|Mr|Mrs|Ms|Dr|Prof|St|Jr|Sr|vs|etc|No|Fig|Vol|e\.g|i\.e)$/.test(s.slice(start, m.index))) continue;
        const end = m.index + m[0].length;
        out.push(s.slice(start, end)); start = end;
      }
      if (start < s.length) out.push(s.slice(start));
      return out;
    }
    // About ten seconds of speech per chunk: long utterances get cut off in Chrome, and chunks
    // always end at a sentence, a comma or a space — never in the middle of a word.
    function chunks(t){
      const out = [];
      for (const line of t.split(/\n+/)){
        const s = line.replace(/\s+/g, ' ').trim()
          .replace(/([\u3000-\u30ff\u3400-\u9fff\uff00-\uffef])\s+(?=[\u3000-\u30ff\u3400-\u9fff\uff00-\uffef])/g, '$1');   // no stray pauses inside Chinese/Japanese text
        let buf = '';
        for (let p of sentences(s)){
          const max = isCJK(buf + p) ? 50 : 170;
          if (buf && (buf + p).length > max){ out.push(buf); buf = ''; }
          while (p.length > max){
            const head = p.slice(0, max);
            let cut = Math.max(0, ...Array.from(head.matchAll(/[，,、：:—–]["'”’」』）)]*\s*/g), m => m.index + m[0].length));
            if (cut < max * 0.4) cut = head.lastIndexOf(' ') + 1;
            if (cut < max * 0.4) cut = max;
            out.push(p.slice(0, cut)); p = p.slice(cut);
          }
          buf += p;
        }
        if (buf) out.push(buf);
      }
      return out.map(x => x.trim()).filter(x => /[\p{L}\p{N}]/u.test(x));     // drop "* * *" and other pure decoration
    }

    // ---- language: decided by the script of each chunk; the book's metadata only refines it
    const norm = l => (l || '').replace(/_/g, '-');
    const prim = l => norm(l).split('-')[0].toLowerCase();
    const zhTag = l => /hant|tw/i.test(l) ? 'zh-TW' : /hk|mo|yue/i.test(l) ? 'zh-HK' : 'zh-CN';
    const REGION = { en:'en-US', ja:'ja-JP', ko:'ko-KR', fr:'fr-FR', de:'de-DE', es:'es-ES', it:'it-IT', pt:'pt-BR', ru:'ru-RU', nl:'nl-NL', pl:'pl-PL', sv:'sv-SE', tr:'tr-TR', vi:'vi-VN', th:'th-TH' };
    function fullTag(l){                                           // "zh" → "zh-CN", "en" → the reader's own kind of English
      l = norm(l); const p = prim(l);
      const mine = () => (navigator.languages || []).map(norm).find(x => prim(x) === p && x.includes('-')) || '';
      if (p === 'zh' || p === 'cmn' || p === 'yue') return zhTag(l.includes('-') || p === 'yue' ? l : mine());
      if (/^[a-z]{2,3}-[a-z]{2}$/i.test(l)) return l;
      return mine() || REGION[p] || l || 'en-US';
    }
    function langOf(t){
      const han = count(t, /[㐀-鿿]/g), kana = count(t, /[぀-ヿ]/g), hangul = count(t, /[가-힯]/g);
      const cyr = count(t, /[Ѐ-ӿ]/g), words = count(t, /[A-Za-zÀ-ɏ]{2,}/g);
      const book = prim(bookLang);
      if ((kana >= 2 && kana * 6 >= han) || (book === 'ja' && han + kana > 0 && han + kana >= words)) return 'ja-JP';
      if (hangul && hangul >= words) return 'ko-KR';
      if (han && han >= words) return fullTag(book === 'zh' || book === 'yue' || book === 'cmn' ? bookLang : 'zh');
      if (cyr && cyr >= words) return /^(ru|uk|bg|sr|be|kk|mk)$/.test(book) ? fullTag(bookLang) : 'ru-RU';
      if (words) return !book || /^(zh|cmn|yue|ja|ko|ru|uk|bg|sr|be|kk|mk)$/.test(book) ? fullTag('en') : fullTag(bookLang);
      return null;                                                 // only digits: read in the page's language
    }
    function build(){
      queue = [];
      blocks().forEach(b => chunks(b.text).forEach(text => queue.push({ el: b.el, text, lang: langOf(text) })));
      const tally = {};
      queue.forEach(q => { if (q.lang) tally[q.lang] = (tally[q.lang] || 0) + q.text.length * (isCJK(q.text) ? 3 : 1); });
      const top = Object.keys(tally).sort((a, b) => tally[b] - tally[a])[0] || fullTag(bookLang || navigator.language || 'en');
      if (top !== pageLang){ pageLang = top; fillPicker(); }
    }

    // ---- voices: rank what this device offers instead of taking the first one in its list
    const base = n => n.replace(/\s*[（(].*$/, '').trim();
    const vtag = v => { const l = norm(v.lang); return /^(zh|cmn|yue)(-|$)/i.test(l) ? zhTag(l) : l; };
    const NOVELTY = /^(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Pipe Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Deranged|Hysterical|Princess|Junior|Ralph|Fred|Kathy)$/i;
    const ELOQUENCE = /^(Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley)$/i;
    const KNOWN_GOOD = /^(Samantha|Alex|Ava|Allison|Susan|Tom|Evan|Nathan|Zoe|Joelle|Noelle|Daniel|Kate|Serena|Oliver|Karen|Lee|Moira|Tessa|Fiona|Rishi|Tingting|Ting-Ting|婷婷|Meijia|Mei-Jia|美佳|美嘉|Sinji|Sin-ji|善怡|Kyoko|Otoya|Yuna|Lili|Lilian|Yu-shu|Li-mu)$/i;
    const FIRST_CHOICE = /Xiaoxiao|Aria|Jenny|Samantha|Tingting|婷婷|Google US English|Google 普通话/i;
    function score(v, want){
      if (bad.has(v.name)) return -1000;
      const raw = norm(v.lang), tag = vtag(v), id = v.name + ' ' + (v.voiceURI || ''), b = base(v.name);
      if (prim(tag) !== prim(want)) return -1000;
      let s = 0;
      if (tag.toLowerCase() === want.toLowerCase()) s += 50;
      else if (prim(want) === 'zh') s += (tag === 'zh-HK' || want === 'zh-HK') ? -200 : 20;   // never Mandarin text in a Cantonese voice, or the reverse
      else s += /-(US|GB)$/i.test(tag) ? 25 : 20;
      if (/^[a-z]{2,3}-[a-z]{2}-\w/i.test(raw)) s -= 40;                                      // regional dialect voices (e.g. zh-CN-liaoning)
      if (/natural|neural/i.test(id)) s += 40;                                                // Edge "Online (Natural)"
      else if (/premium/i.test(id)) s += 32;
      else if (/enhanced|siri/i.test(id)) s += 28;
      else if (/^Google /.test(v.name)) s += 12;
      if (NOVELTY.test(b) || (modernApple && /speech\.synthesis\.voice\./.test(v.voiceURI || ''))) s -= 90;   // Bells, Whisper, Zarvox…
      else if (ELOQUENCE.test(b) || /eloquence/i.test(id) || multi.has(b)) s -= 60;                         // old robotic synthesizer
      else if (KNOWN_GOOD.test(b)) s += 15;
      if (/compact/i.test(id)) s -= 3;
      if (FIRST_CHOICE.test(v.name)) s += 4;
      if (v.default) s += 8;
      return s;
    }
    const ranked = want => voices.map((v, i) => ({ v, i, s: score(v, want) })).filter(x => x.s > -900)
                                 .sort((a, b) => b.s - a.s || a.i - b.i).map(x => x.v);
    function voiceFor(lang){
      const name = store.get('epub:voice:' + prim(lang));           // the reader's own choice, kept per language
      return (name && voices.find(v => v.name === name && !bad.has(name) && prim(vtag(v)) === prim(lang))) || ranked(lang)[0] || null;
    }
    const label = v => v.name.replace(/^Microsoft /, '').replace(/ Online \(Natural\) - .*$/, ' (Natural)').replace(/ - .*$/, '');
    function fillPicker(){
      const sel = $('ttsVoice'), list = pageLang ? ranked(pageLang) : [];
      const regions = new Set(list.map(vtag)).size > 1;
      sel.length = 0;
      const add = (value, text) => { const o = document.createElement('option'); o.value = value; o.textContent = text; sel.appendChild(o); };
      add('', list.length ? 'Auto · ' + label(list[0]) : 'Auto voice');
      list.forEach(v => add(v.name, label(v) + (regions ? ' · ' + vtag(v) : '')));
      const pick = store.get('epub:voice:' + prim(pageLang)) || '';
      sel.value = list.some(v => v.name === pick) ? pick : '';
    }
    function loadVoices(){
      voices = synth.getVoices() || [];
      const seen = {};                                              // the same name offered in many languages = a generic robotic synthesizer
      voices.forEach(v => { const b = base(v.name); (seen[b] = seen[b] || new Set()).add(prim(v.lang)); });
      multi = new Set(Object.keys(seen).filter(k => seen[k].size >= 4));
      modernApple = voices.some(v => /com\.apple\.(voice\.|ttsbundle)/.test(v.voiceURI || ''));
      fillPicker();
    }
    loadVoices();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', loadVoices);

    function mark(el){
      document.querySelectorAll('.tts-cur').forEach(e => e.classList.remove('tts-cur'));
      if (!el || el === $('page')) return;
      el.classList.add('tts-cur');
      const r = el.getBoundingClientRect();
      if (r.top < 70 || r.bottom > innerHeight - 130) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    function msg(t){ $('ttsMsg').textContent = t || ''; $('ttsMsg').style.display = t ? 'block' : 'none'; }
    function ui(){ $('ttsPlay').textContent = playing ? '❚❚' : '▶'; $('ttsPlay').title = playing ? 'Pause' : 'Play'; }

    function speak(){
      const my = ++session; clearTimeout(timer);
      if (pos >= queue.length){ if (synth.speaking || synth.pending) synth.cancel(); return pageDone(my); }
      const item = queue[pos], lang = item.lang || pageLang, v = voiceFor(lang);
      const u = utter = new SpeechSynthesisUtterance(item.text);   // keep a reference so it isn't garbage-collected
      if (v){ u.voice = v; u.lang = norm(v.lang); } else u.lang = lang;
      const rate = parseFloat($('ttsRate').value) || 1;
      u.rate = rate; u.pitch = 1; u.volume = 1;
      let started = false;
      const next = () => { if (my === session && playing){ clearTimeout(timer); pos++; speak(); } };
      const swap = () => { if (my === session && playing){ clearTimeout(timer); bad.add(v.name); fillPicker(); speak(); } };   // try the next-best voice
      u.onstart = () => {
        started = true; clearTimeout(timer);
        timer = setTimeout(next, (item.text.length * (isCJK(item.text) ? 0.5 : 0.14) / rate + 10) * 1000);   // never hang on a stuck utterance
      };
      u.onend = next;
      u.onerror = e => {
        if (my !== session || e.error === 'interrupted' || e.error === 'canceled') return;
        if (e.error === 'not-allowed'){ clearTimeout(timer); playing = false; ui(); msg('Tap ▶ to start reading.'); return; }
        if (v && !started) swap(); else next();
      };
      mark(item.el); msg('');
      const go = () => {
        if (my !== session || !playing) return;
        synth.speak(u);
        if (v && !v.localService) timer = setTimeout(() => { if (!started) swap(); }, 6000);                 // online voice that never answers
      };
      // Only interrupt when something is actually playing; going sentence to sentence needs no gap.
      if (synth.speaking || synth.pending){ synth.cancel(); setTimeout(go, 80); } else go();
    }
    async function pageDone(my){
      if ($('ttsAuto').checked && cur < spine.length - 1){
        await show(cur + 1, null, true);
        if (my !== session || !playing) return;
        build(); pos = 0; speak();
      } else {
        playing = false; pos = 0; mark(null); ui();
      }
    }

    function play(from){
      build();
      if (typeof from === 'number') pos = from;
      if (pos >= queue.length) pos = 0;
      if (!queue.length && !($('ttsAuto').checked && cur < spine.length - 1)){ msg('There is no text on this page to read.'); return; }
      playing = true; ui(); speak();
    }
    function pause(){ playing = false; session++; clearTimeout(timer); synth.cancel(); ui(); }      // resumes from the same sentence
    function halt(){ pause(); pos = 0; queue = []; mark(null); msg(''); }      // page changed
    function close(){ halt(); document.body.classList.remove('tts-on'); }

    $('speak').onclick = () => {
      if (document.body.classList.contains('tts-on')) return close();
      document.body.classList.add('tts-on'); play(0);
    };
    $('ttsPlay').onclick = () => playing ? pause() : play();
    $('ttsStop').onclick = close;
    $('ttsRate').value = store.get('epub:rate') || '1';
    if (!$('ttsRate').value) $('ttsRate').value = '1';
    $('ttsRate').onchange = () => { store.set('epub:rate', $('ttsRate').value); if (playing) speak(); };
    $('ttsVoice').onchange = () => { store.set('epub:voice:' + prim(pageLang), $('ttsVoice').value); fillPicker(); if (playing) speak(); };
    $('ttsAuto').checked = store.get('epub:auto') !== '0';
    $('ttsAuto').onchange = () => store.set('epub:auto', $('ttsAuto').checked ? '1' : '0');

    // While the panel is open, click any paragraph to start reading from there.
    $('page').addEventListener('click', e => {
      if (!document.body.classList.contains('tts-on') || e.target.closest('a') || String(getSelection())) return;
      build();
      const el = e.target.closest('.tts-block'); if (!el) return;
      const i = queue.findIndex(q => q.el === el);
      if (i >= 0){ pos = i; playing = true; ui(); speak(); }
    });
    document.addEventListener('keydown', e => {
      if (e.key !== ' ' || !document.body.classList.contains('tts-on') || /^(BUTTON|SELECT|INPUT)$/.test(e.target.tagName)) return;
      e.preventDefault(); $('ttsPlay').click();
    });
    addEventListener('pagehide', () => synth.cancel());
    synth.cancel();                                                // clear anything left over from a reload
    return { halt, close };
  })();

  // ---------- file input / drag-drop ----------
  $('file').onchange = e => e.target.files[0] && openFile(e.target.files[0]);
  const card = $('card');
  ['dragenter','dragover'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); card.classList.add('over'); }));
  ['dragleave','drop'].forEach(t => document.addEventListener(t, e => { e.preventDefault(); card.classList.remove('over'); }));
  document.addEventListener('drop', e => { const f = e.dataTransfer.files[0]; if (f) openFile(f); });
})();
</script>
</body>
</html>
